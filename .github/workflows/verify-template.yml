# テンプレート自身の安全網が壊れていないかを毎push検査する。
# 検査内容は scripts/verify_safety_net.py を参照（hookの回帰テスト、
# settings.jsonのdenyベースライン、スキルの整合性、CI雛形の構文、リンク切れ）。
name: verify-template
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 scripts/verify_safety_net.py